<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<title>כותרת כרטיס מאמר - השוואת גדלים</title>
<style>
@font-face{font-family:"Talent FS";src:url("public/fonts/Talent_FS-Light.woff2") format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Talent FS";src:url("public/fonts/Talent_FS-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Talent FS";src:url("public/fonts/Talent_FS-Demibold.woff2") format("woff2");font-weight:600;font-display:swap}
*{box-sizing:border-box;margin:0}
body{background:#050E40;font-family:"Talent FS",system-ui,sans-serif;color:#fff;padding:40px 28px 70px}
h1{font-weight:600;font-size:26px;color:#B99E64;text-align:center;margin-bottom:8px}
.sub{text-align:center;color:#F0FDFF;opacity:.7;font-weight:300;font-size:16px;margin-bottom:38px}
.row{display:flex;gap:34px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:14px}
.tag{font-size:15px;color:#B99E64;font-weight:600;letter-spacing:.02em}
.card{display:flex;width:313px;min-height:265px;flex-direction:column;align-items:center;justify-content:center;
 border-radius:5px;background:rgba(255,255,255,.1);padding:20px 15px;box-shadow:0 10px 20px rgba(0,0,0,.2)}
.inner{display:flex;width:274px;flex-direction:column;align-items:flex-start;gap:15px}
.pic{position:relative;aspect-ratio:350/137;width:100%;overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%}
h3{font-weight:600;color:#fff;text-wrap:balance}
.line{height:2px;width:100%;background:#B99E64}
.meta{display:flex;width:100%;align-items:flex-end;justify-content:space-between}
.meta div{font-weight:400;font-size:16px;line-height:13px}
.meta p:first-child{margin-bottom:12px}
.btn{background:#B99E64;color:#050E40;border-radius:5px;padding:9px 18px;font-size:16px;font-weight:600}
</style></head><body>
<h1>כותרת כרטיס מאמר</h1>
<p class="sub">אותו כרטיס, ארבעה גדלי כותרת. הכותרת הארוכה ביותר באתר.</p>
<div class="row" id="row"></div>
<script>
const sizes=[[30,28,"30 / 28 - המצב היום"],[26,26,"26 / 26"],[24,24,"24 / 24"],[21,22,"21 / 22"]];
const img="public/assets/article-payroll-audit.jpg";
document.getElementById('row').innerHTML=sizes.map(([fs,lh,label])=>`
<div class="col"><span class="tag">${label}</span>
<article class="card"><div class="inner">
<div class="pic"><img src="${img}" alt=""></div>
<h3 style="font-size:${fs}px;line-height:${lh}px">בודק שכר מוסמך כחלק ממערך הבקרה של הארגון</h3>
<span class="line"></span>
<div class="meta"><div><p>ביקורות שכר</p><p>19/10/2026</p></div><span class="btn">לקריאה</span></div>
</div></article></div>`).join('');
</script></body></html>
