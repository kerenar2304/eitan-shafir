<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/svg+xml" href="public/assets/es-mark.svg" />
<title>ניהול התוכן | איתן שפיר ושות׳</title>
<style>
  :root{
    --navy:#050E40; --gold:#B99E64; --gold-ink:#8A6F35;
    --ink:#1B2033; --grey:#667085; --line:#E4E7EC; --bg:#F6F7F9; --red:#B42318;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{
    margin:0; min-height:100dvh; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:17px; line-height:1.6;
  }
  button{font:inherit; cursor:pointer}
  :focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:6px}

  /* ---------- gate ---------- */
  .gate{min-height:100dvh; display:grid; place-items:center; background:var(--navy); padding:24px}
  .gate form{width:min(400px,100%); background:#fff; border-radius:16px; padding:36px 30px; text-align:center}
  .gate img{width:72px; height:auto; margin-bottom:20px}
  .gate h1{margin:0 0 8px; font-size:25px}
  .gate p{margin:0 0 24px; color:var(--grey)}
  .gate input{width:100%; font:inherit; font-size:21px; text-align:center; letter-spacing:.25em;
    padding:13px; border:1px solid var(--line); border-radius:10px; background:#fff}
  .gate button{width:100%; margin-top:14px; min-height:52px; border:0; border-radius:10px;
    background:var(--navy); color:#fff; font-size:18px}
  .gate .err{margin:12px 0 0; min-height:24px; color:var(--red)}

  /* ---------- shell ---------- */
  .bar{position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:14px;
    padding:12px 20px; background:var(--navy); color:#fff}
  .bar img{height:28px}
  .bar strong{font-size:18px; font-weight:600}
  .bar .sp{flex:1}
  .bar .state{font-size:15px; color:#D9C79A; white-space:nowrap}
  .bar button{min-height:44px; padding:0 18px; border-radius:9px; border:0; font-size:16px}
  .bar .save{background:var(--gold); color:var(--navy); font-weight:600}
  .bar .save[disabled]{opacity:.45; cursor:default}
  .bar .link{background:transparent; color:#fff; border:1px solid rgb(255 255 255/.45)}

  main{max-width:780px; margin:0 auto; padding:22px 20px 90px}
  .back{display:inline-flex; align-items:center; gap:7px; min-height:44px; padding:0 16px;
    margin-bottom:14px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink); font-size:16px}
  h2.title{margin:0 0 6px; font-size:28px; font-weight:600}
  p.lede{margin:0 0 22px; color:var(--grey)}

  /* ---------- menu rows ---------- */
  .menu{display:grid; gap:12px}
  .menu button{display:flex; align-items:center; gap:16px; width:100%; text-align:start;
    padding:20px 22px; border:1px solid var(--line); border-radius:14px; background:#fff; color:var(--ink)}
  .menu button:hover{border-color:var(--gold)}
  .menu .t{flex:1}
  .menu .t b{display:block; font-size:19px; font-weight:600}
  .menu .t span{display:block; color:var(--grey); font-size:15px}
  .menu .go{color:var(--gold-ink); font-size:22px}

  /* ---------- cards and fields ---------- */
  .card{border:1px solid var(--line); border-radius:14px; background:#fff; padding:18px 20px; margin-bottom:14px}
  .card .head{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
  .card .head h3{margin:0; flex:1; font-size:18px; font-weight:600}
  .field{margin-bottom:16px}
  .field > label{display:block; font-size:15px; color:var(--grey); margin-bottom:6px}
  .field input,.field textarea{width:100%; font:inherit; padding:12px 14px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink); resize:vertical; min-height:48px}
  .field textarea{line-height:1.7}
  .row{display:flex; gap:12px; flex-wrap:wrap}
  .row > .field{flex:1 1 200px}
  .tool{min-height:40px; padding:0 13px; border:1px solid var(--line); border-radius:9px;
    background:#fff; color:var(--gold-ink); font-size:15px}
  .tool:hover{border-color:var(--gold)}
  .tool.del{color:var(--red)}
  .tool.del:hover{border-color:var(--red)}
  .add{width:100%; min-height:52px; margin-top:4px; border:1px dashed var(--gold); border-radius:12px;
    background:#fff; color:var(--gold-ink); font-size:17px}
  .add:hover{background:#FFFCF5}
  .note{border:1px solid var(--line); border-right:4px solid var(--gold); border-radius:12px;
    background:#fff; padding:16px 18px; margin-bottom:18px; color:var(--ink)}
  .note b{color:var(--gold-ink)}
  .empty{text-align:center; color:var(--grey); padding:30px 10px 22px}

  /* ---------- article body blocks ---------- */
  .block{border:1px solid var(--line); border-radius:12px; background:#FCFBF8; padding:14px 16px; margin-bottom:12px}
  .block .kind{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap}
  .block select{font:inherit; font-size:15px; min-height:40px; padding:0 10px; border-radius:9px;
    border:1px solid var(--line); background:#fff; color:var(--ink)}
  .block .sp{flex:1}

  @media (max-width:560px){
    .bar{flex-wrap:wrap}
    .bar .state{width:100%; order:9}
    main{padding:18px 14px 80px}
    h2.title{font-size:24px}
  }
</style>
</head>
<body>

<div id="gate" class="gate">
  <form id="gateForm">
    <img src="public/assets/es-mark.svg" alt="" />
    <h1>ניהול התוכן</h1>
    <p>האתר של איתן שפיר ושות׳</p>
    <input id="pass" type="password" inputmode="numeric" autocomplete="current-password" aria-label="סיסמה" />
    <button type="submit">כניסה</button>
    <p class="err" id="gateErr" role="status"></p>
  </form>
</div>

<div id="app" hidden>
  <div class="bar">
    <img src="public/assets/logo-light.svg" alt="איתן שפיר ושות׳" />
    <strong>ניהול התוכן</strong>
    <span class="sp"></span>
    <span class="state" id="state" role="status"></span>
    <button class="link" id="viewSite" type="button">האתר</button>
    <button class="save" id="save" type="button" disabled>שמירה</button>
  </div>
  <main id="screen"></main>
</div>

<script>
/* ------------------------------------------------------------------ *
 *  Content panel. One screen at a time: a short menu, then one thing
 *  to edit. It works on a copy of the site texts and hands the result
 *  back as a file that gets published to the site.
 * ------------------------------------------------------------------ */

const PASSWORD = "123456";

/* plain names for every field, by group */
const LABELS = {
  home: { _name: "דף הבית", _hint: "הכותרות והפסקאות של העמוד הראשון.",
    heroLine1: "כותרת ראשית, שורה 1", heroLine2: "כותרת ראשית, שורה 2",
    heroSubA: "כותרת משנה, שורה 1", heroSubB: "כותרת משנה, שורה 2", heroButton: "כפתור בפתיחה",
    servicesTitle: "כותרת תחומי התמחות", servicesIntroA: "פתיח התמחות, שורה 1", servicesIntroB: "פתיח התמחות, שורה 2",
    differenceTitle: "כותרת סקשן הגישה", clientsTitle: "כותרת לקוחות",
    clientsIntroA: "פתיח לקוחות, שורה 1", clientsIntroB: "פתיח לקוחות, שורה 2",
    aboutTitle: "כותרת על המשרד", aboutP1: "על המשרד, פסקה 1", aboutP2: "על המשרד, פסקה 2", aboutP3: "על המשרד, פסקה 3",
    aboutButton: "כפתור על המשרד",
    articlesTitleA: "כותרת מאמרים, שורה 1", articlesTitleB: "כותרת מאמרים, שורה 2", articlesButton: "כפתור מאמרים" },
  about: { _name: "עמוד אודות", _hint: "פסקאות הפתיחה, המספרים, ענפי הלקוחות והשותפים. אנשי הצוות נמצאים במסך נפרד.",
    officeTitle: "כותרת הסקשן", officeP1: "פסקה 1", officeP2: "פסקה 2", officeP3: "פסקה 3",
    stats: "המספרים", to: "מספר", suffix: "סימן אחרי המספר", label: "תיאור",
    sectorsTitle: "כותרת ענפי הלקוחות", sectors: "ענפי לקוחות",
    partners: "שותפים", name: "שם", role: "תפקיד", img: "נתיב תמונה",
    p1: "פסקה 1", p2: "פסקה 2", p3: "פסקה 3", highlights: "שלוש הקוביות", value: "כותרת הקובייה",
    teamTitle: "כותרת הצוות", teamIntro: "פסקת פתיחה לצוות" },
  servicesPage: { _name: "עמוד תחומי התמחות", _hint: "הכותרת והפתיח של העמוד, ושתי המחלקות.",
    title: "כותרת העמוד", introA: "פסקה 1", introB: "פסקה 2",
    departments: "מחלקות", tab: "שם הלשונית", mobileTab: "שם הלשונית במובייל", lead: "בראשות" },
  serviceDetails: { _name: "תוכן התחומים",
    title: "כותרת מלאה (לא חובה)", subtitle: "כותרת משנה", paragraphs: "פסקאות",
    listTitle: "כותרת הרשימה", list: "פריטי הרשימה", note: "הערה בסוף" },
  articlesPage: { _name: "עמוד המאמרים", _hint: "הכותרת של עמוד המאמרים, לא המאמרים עצמם.",
    title: "כותרת", intro: "פסקת פתיחה", featuredTab: "לשונית המאמר האחרון", featuredButton: "כפתור קריאה" },
  contact: { _name: "יצירת קשר", _hint: "הטקסטים בטופס שבתחתית כל עמוד.",
    title: "כותרת", intro: "פסקת פתיחה", privacyNote: "הערת פרטיות", privacyLink: "טקסט הקישור", submit: "כפתור שליחה" },
};

const TEXT_PAGES = ["home", "about", "servicesPage", "serviceDetails", "articlesPage", "contact"];

const LONG = ["intro","excerpt","aboutP1","aboutP2","aboutP3","officeP1","officeP2","officeP3","p1","p2","p3",
  "teamIntro","introA","introB","servicesIntroA","servicesIntroB","clientsIntroA","clientsIntroB",
  "privacyNote","heroSubA","heroSubB","subtitle","note","paragraphs","text"];
const SHORT = ["tag","date","to","suffix","img","slug","role","value"];

const BLOCK_KINDS = [
  ["p", "פסקה"], ["h2", "כותרת משנה"], ["lead", "פסקת פתיחה"],
  ["list", "רשימה"], ["quote", "ציטוט מודגש"], ["callout", "תיבת הדגשה"], ["note", "הערה"],
];

let data = null;          /* { content: {...}, bodies: { slug: [blocks] } } */
let dirty = false;
let view = { s: "home" }; /* which screen is open */
let scope = "home";       /* which LABELS group the field names come from */

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};
const setState = (m) => ($("state").textContent = m);

function touch() {
  dirty = true;
  $("save").disabled = false;
  setState("יש שינויים שלא נשמרו");
  try { localStorage.setItem("es-panel-draft", JSON.stringify(data)); } catch (e) { /* storage blocked */ }
}

/* ---------------- entry ---------------- */
$("gateForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if ($("pass").value.trim() === PASSWORD) { sessionStorage.setItem("es-panel", "1"); enter(); }
  else $("gateErr").textContent = "סיסמה שגויה";
});
if (sessionStorage.getItem("es-panel") === "1") enter();

function enter() {
  $("gate").hidden = true;
  $("app").hidden = false;
  load();
}

async function load() {
  setState("טוען…");
  const res = await fetch("panel-data.json", { cache: "no-store" });
  data = await res.json();
  const saved = localStorage.getItem("es-panel-draft");
  if (saved) {
    try {
      const draft = JSON.parse(saved);
      if (confirm("יש כאן טיוטה מהפעם הקודמת שלא נשמרה. להמשיך ממנה?")) { data = draft; dirty = true; $("save").disabled = false; }
      else localStorage.removeItem("es-panel-draft");
    } catch (e) { /* a broken draft is ignored */ }
  }
  setState(dirty ? "יש שינויים שלא נשמרו" : "");
  render();
}

/* ---------------- small builders ---------------- */
function field(labelText, value, onInput, long) {
  const wrap = el("div", "field");
  const label = el("label", null, labelText);
  const input = el(long ? "textarea" : "input");
  if (long) input.rows = Math.min(9, Math.ceil(String(value || "").length / 55) + 2);
  input.value = value == null ? "" : value;
  input.addEventListener("input", () => { onInput(input.value); touch(); });
  wrap.appendChild(label);
  wrap.appendChild(input);
  return wrap;
}

function tool(text, cls, onClick) {
  const b = el("button", "tool " + (cls || ""), text);
  b.type = "button";
  b.onclick = onClick;
  return b;
}

function menuRow(title, sub, onClick) {
  const b = el("button");
  b.type = "button";
  const t = el("div", "t");
  t.appendChild(el("b", null, title));
  t.appendChild(el("span", null, sub));
  b.appendChild(t);
  b.appendChild(el("span", "go", "‹"));
  b.onclick = onClick;
  return b;
}

function blankLike(sample) {
  if (typeof sample === "string") return "";
  if (typeof sample === "number") return 0;
  if (Array.isArray(sample)) return sample.length ? [blankLike(sample[0])] : [];
  const out = {};
  Object.keys(sample).forEach((k) => (out[k] = blankLike(sample[k])));
  return out;
}

const labelFor = (key) => (LABELS[scope] && LABELS[scope][key]) || key;
const go = (s, arg) => { view = { s: s, arg: arg }; render(); window.scrollTo({ top: 0 }); };

/* ---------------- generic field rendering ---------------- */
function renderValue(box, key, holder, prop) {
  const value = holder[prop];

  if (value === null || typeof value !== "object") {
    const isNumber = typeof value === "number";
    box.appendChild(field(labelFor(key), value, (v) => (holder[prop] = isNumber ? Number(v) || 0 : v), LONG.includes(key)));
    return;
  }

  if (Array.isArray(value)) {
    const card = el("div", "card");
    const head = el("div", "head");
    head.appendChild(el("h3", null, labelFor(key)));
    head.appendChild(tool("הוספה +", "", () => {
      value.push(value.length ? blankLike(value[value.length - 1]) : "");
      touch(); render();
    }));
    card.appendChild(head);

    value.forEach((item, i) => {
      if (item === null || typeof item !== "object") {
        const row = el("div", "row");
        row.style.alignItems = "flex-end";
        const f = field(String(i + 1), item, (v) => (value[i] = v), LONG.includes(key));
        f.style.flex = "1 1 220px";
        row.appendChild(f);
        const del = tool("מחיקה", "del", () => { value.splice(i, 1); touch(); render(); });
        del.style.marginBottom = "16px";
        row.appendChild(del);
        card.appendChild(row);
        return;
      }
      const sub = el("div", "card");
      const subHead = el("div", "head");
      subHead.appendChild(el("h3", null, (i + 1) + ". " + (item.name || item.title || item.tab || item.value || item.label || "")));
      subHead.appendChild(tool("מחיקה", "del", () => { value.splice(i, 1); touch(); render(); }));
      sub.appendChild(subHead);
      renderObject(sub, item);
      card.appendChild(sub);
    });
    box.appendChild(card);
    return;
  }

  const card = el("div", "card");
  card.appendChild(el("h3", null, labelFor(key)));
  renderObject(card, value);
  box.appendChild(card);
}

function renderObject(box, obj, skip) {
  let row = null;
  Object.keys(obj).forEach((k) => {
    if (skip && skip.indexOf(k) >= 0) return;
    const v = obj[k];
    if (SHORT.includes(k) && (v === null || typeof v !== "object")) {
      if (!row) { row = el("div", "row"); box.appendChild(row); }
      renderValue(row, k, obj, k);
      return;
    }
    row = null;
    renderValue(box, k, obj, k);
  });
}

/* ---------------- screens ---------------- */
function head(box, title, lede, backTo, backText) {
  if (backTo) {
    const b = el("button", "back", "› " + backText);
    b.type = "button";
    b.onclick = () => go(backTo.s, backTo.arg);
    box.appendChild(b);
  }
  box.appendChild(el("h2", "title", title));
  if (lede) box.appendChild(el("p", "lede", lede));
}

function scrHome(box) {
  box.appendChild(el("h2", "title", "מה נעדכן היום?"));
  box.appendChild(el("p", "lede", "בוחרים נושא, מעדכנים, ובסוף לוחצים שמירה למעלה."));
  const menu = el("div", "menu");
  menu.appendChild(menuRow("מאמרים", data.content.articles.length + " מאמרים באתר. הוספה, עריכה ומחיקה.", () => go("articles")));
  menu.appendChild(menuRow("אנשי הצוות", data.content.about.team.length + " אנשים בעמוד אודות. שמות, תפקידים וסדר.", () => go("team")));
  menu.appendChild(menuRow("טקסטים באתר", "כל הכותרות והפסקאות, לפי עמוד.", () => go("texts")));
  box.appendChild(menu);
}

/* ---- articles ---- */
function scrArticles(box) {
  head(box, "מאמרים", "המאמר הראשון ברשימה הוא זה שמוצג כמאמר האחרון בדף הבית ובעמוד המאמרים.", { s: "home" }, "חזרה");

  const arts = data.content.articles;
  if (!arts.length) box.appendChild(el("p", "empty", "אין עדיין מאמרים באתר."));

  arts.forEach((a, i) => {
    const card = el("div", "card");
    const h = el("div", "head");
    h.appendChild(el("h3", null, a.title || "מאמר ללא כותרת"));
    h.appendChild(tool("עריכה", "", () => go("article", i)));
    card.appendChild(h);

    const meta = el("p", null, [a.tag, a.date].filter(Boolean).join(" · "));
    meta.style.cssText = "margin:0 0 12px;color:var(--grey);font-size:15px";
    card.appendChild(meta);

    const row = el("div", "row");
    row.appendChild(tool("↑ למעלה", "", () => { if (i > 0) { const t = arts[i - 1]; arts[i - 1] = arts[i]; arts[i] = t; touch(); render(); } }));
    row.appendChild(tool("↓ למטה", "", () => { if (i < arts.length - 1) { const t = arts[i + 1]; arts[i + 1] = arts[i]; arts[i] = t; touch(); render(); } }));
    row.appendChild(tool("מחיקה", "del", () => {
      if (confirm("למחוק את המאמר ״" + (a.title || "") + "״?")) {
        delete data.bodies[a.slug];
        arts.splice(i, 1);
        touch(); render();
      }
    }));
    card.appendChild(row);
    box.appendChild(card);
  });

  const add = el("button", "add", "מאמר חדש +");
  add.type = "button";
  add.onclick = () => {
    const slug = "article-" + Date.now().toString(36);
    const today = new Date().toLocaleDateString("he-IL").replace(/\./g, "/");
    arts.unshift({ slug: slug, title: "", tag: "", date: today, img: arts[0] ? arts[0].img : "", author: "", excerpt: "" });
    data.bodies[slug] = [{ t: "lead", text: "" }, { t: "p", text: "" }];
    touch(); go("article", 0);
  };
  box.appendChild(add);
}

function scrArticle(box, i) {
  const a = data.content.articles[i];
  if (!a) return go("articles");
  head(box, a.title || "מאמר חדש", null, { s: "articles" }, "חזרה למאמרים");

  const card = el("div", "card");
  card.appendChild(field("כותרת המאמר", a.title, (v) => (a.title = v)));
  const row = el("div", "row");
  row.appendChild(field("נושא", a.tag, (v) => (a.tag = v)));
  row.appendChild(field("תאריך", a.date, (v) => (a.date = v)));
  card.appendChild(row);
  card.appendChild(field("מאת", a.author, (v) => (a.author = v)));
  card.appendChild(field("תקציר, מופיע בכרטיס ברשימה", a.excerpt, (v) => (a.excerpt = v), true));
  card.appendChild(field("תמונה (נתיב הקובץ, לתמונה חדשה יש לשלוח לי אותה)", a.img, (v) => (a.img = v)));
  box.appendChild(card);

  const t = el("h3", null, "גוף המאמר");
  t.style.cssText = "margin:26px 0 4px;font-size:20px";
  box.appendChild(t);
  box.appendChild(el("p", "lede", "כל חלק הוא פסקה, כותרת או רשימה. אפשר להוסיף, להזיז ולמחוק."));

  const body = (data.bodies[a.slug] = data.bodies[a.slug] || []);
  body.forEach((b, j) => box.appendChild(renderBlock(body, b, j)));

  const add = el("button", "add", "הוספת חלק +");
  add.type = "button";
  add.onclick = () => { body.push({ t: "p", text: "" }); touch(); render(); };
  box.appendChild(add);
}

function renderBlock(body, b, j) {
  const wrap = el("div", "block");
  const kind = el("div", "kind");

  const sel = el("select");
  sel.setAttribute("aria-label", "סוג החלק");
  BLOCK_KINDS.forEach((pair) => {
    const o = el("option", null, pair[1]);
    o.value = pair[0];
    o.selected = b.t === pair[0];
    sel.appendChild(o);
  });
  sel.onchange = () => {
    b.t = sel.value;
    if (b.t === "list" && !b.items) { b.items = [""]; delete b.text; }
    if (b.t !== "list" && b.text === undefined) { b.text = ""; delete b.items; }
    if (b.t !== "callout") delete b.title;
    touch(); render();
  };
  kind.appendChild(sel);
  kind.appendChild(el("span", "sp"));
  kind.appendChild(tool("↑", "", () => { if (j > 0) { const t = body[j - 1]; body[j - 1] = body[j]; body[j] = t; touch(); render(); } }));
  kind.appendChild(tool("↓", "", () => { if (j < body.length - 1) { const t = body[j + 1]; body[j + 1] = body[j]; body[j] = t; touch(); render(); } }));
  kind.appendChild(tool("מחיקה", "del", () => { body.splice(j, 1); touch(); render(); }));
  wrap.appendChild(kind);

  if (b.t === "callout") wrap.appendChild(field("כותרת התיבה", b.title, (v) => (b.title = v)));

  if (b.t === "list") {
    b.items = b.items || [""];
    b.items.forEach((item, k) => {
      const row = el("div", "row");
      row.style.alignItems = "flex-end";
      const f = field("פריט " + (k + 1), item, (v) => (b.items[k] = v));
      f.style.flex = "1 1 220px";
      row.appendChild(f);
      const del = tool("מחיקה", "del", () => { b.items.splice(k, 1); touch(); render(); });
      del.style.marginBottom = "16px";
      row.appendChild(del);
      wrap.appendChild(row);
    });
    wrap.appendChild(tool("הוספת פריט +", "", () => { b.items.push(""); touch(); render(); }));
  } else {
    wrap.appendChild(field("טקסט", b.text, (v) => (b.text = v), true));
  }
  return wrap;
}

/* ---- team ---- */
function scrTeam(box) {
  head(box, "אנשי הצוות", "הסדר כאן הוא הסדר בעמוד אודות. לתמונה חדשה יש לשלוח לי את הקובץ.", { s: "home" }, "חזרה");

  const team = data.content.about.team;
  team.forEach((m, i) => {
    const card = el("div", "card");
    const h = el("div", "head");
    const title = el("h3", null, m.name || "איש צוות חדש");
    h.appendChild(title);
    h.appendChild(tool("↑", "", () => { if (i > 0) { const t = team[i - 1]; team[i - 1] = team[i]; team[i] = t; touch(); render(); } }));
    h.appendChild(tool("↓", "", () => { if (i < team.length - 1) { const t = team[i + 1]; team[i + 1] = team[i]; team[i] = t; touch(); render(); } }));
    h.appendChild(tool("מחיקה", "del", () => {
      if (confirm("למחוק את " + (m.name || "איש הצוות") + "?")) { team.splice(i, 1); touch(); render(); }
    }));
    card.appendChild(h);

    const row = el("div", "row");
    row.appendChild(field("שם", m.name, (v) => { m.name = v; title.textContent = v || "איש צוות חדש"; }));
    row.appendChild(field("תפקיד", m.role, (v) => (m.role = v)));
    card.appendChild(row);
    card.appendChild(field("תמונה (נתיב הקובץ, אפשר להשאיר ריק)", m.img, (v) => (m.img = v)));
    box.appendChild(card);
  });

  const add = el("button", "add", "הוספת איש צוות +");
  add.type = "button";
  add.onclick = () => { team.push({ name: "", role: "", img: "" }); touch(); render(); };
  box.appendChild(add);
}

/* ---- texts ---- */
function scrTexts(box) {
  head(box, "טקסטים באתר", "בוחרים עמוד, ומעדכנים את הטקסטים שבו.", { s: "home" }, "חזרה");
  const menu = el("div", "menu");
  TEXT_PAGES.forEach((key) => {
    if (!data.content[key]) return;
    const meta = LABELS[key] || {};
    const sub = key === "serviceDetails"
      ? Object.keys(data.content[key]).length + " תחומים, מה שנפתח בלחיצה על תחום"
      : (meta._hint || "");
    menu.appendChild(menuRow(meta._name || key, sub, () => go("page", key)));
  });
  box.appendChild(menu);
}

function scrPage(box, key) {
  scope = key;
  const meta = LABELS[key] || {};

  /* the service folders are a long list, so they get a menu of their own */
  if (key === "serviceDetails") {
    head(box, meta._name, "בוחרים תחום כדי לערוך את התוכן שנפתח בלחיצה עליו באתר.", { s: "texts" }, "חזרה לטקסטים");
    const menu = el("div", "menu");
    Object.keys(data.content[key]).forEach((name) => {
      const d = data.content[key][name];
      const first = (d.paragraphs && d.paragraphs[0]) || "";
      menu.appendChild(menuRow(name.replace("\n", " "), first.slice(0, 70) + (first.length > 70 ? "…" : ""), () => go("folder", name)));
    });
    box.appendChild(menu);
    return;
  }

  head(box, meta._name || key, meta._hint, { s: "texts" }, "חזרה לטקסטים");
  const card = el("div", "card");
  renderObject(card, data.content[key], key === "about" ? ["team"] : null);
  box.appendChild(card);
}

function scrFolder(box, name) {
  scope = "serviceDetails";
  head(box, name.replace("\n", " "), "התוכן שנפתח בלחיצה על התחום הזה באתר.", { s: "page", arg: "serviceDetails" }, "חזרה לתחומים");
  const card = el("div", "card");
  renderObject(card, data.content.serviceDetails[name]);
  box.appendChild(card);
}

/* ---------------- router ---------------- */
function render() {
  const box = $("screen");
  box.innerHTML = "";
  scope = "home";
  if (view.s === "articles") return scrArticles(box);
  if (view.s === "article") return scrArticle(box, view.arg);
  if (view.s === "team") return scrTeam(box);
  if (view.s === "texts") return scrTexts(box);
  if (view.s === "page") return scrPage(box, view.arg);
  if (view.s === "folder") return scrFolder(box, view.arg);
  return scrHome(box);
}

/* ---------------- saving ---------------- */
$("save").onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = el("a");
  const stamp = new Date().toISOString().slice(0, 16).replace("T", "-").replace(":", "");
  a.href = url;
  a.download = "eitan-shafir-content-" + stamp + ".json";
  a.click();
  URL.revokeObjectURL(url);

  dirty = false;
  $("save").disabled = true;
  setState("הקובץ ירד למחשב");

  const note = el("div", "note");
  note.innerHTML = "<b>הקובץ ירד למחשב.</b><br />הוא מכיל את כל התוכן המעודכן. שולחים אותו לקרן, והשינויים עולים לאתר." +
    "<br />מה שערכת נשמר גם בדפדפן הזה, אז אפשר לסגור ולחזור להמשיך.";
  $("screen").prepend(note);
  window.scrollTo({ top: 0, behavior: "smooth" });
};

$("viewSite").onclick = () => window.open("index.html", "_blank", "noopener");

window.addEventListener("beforeunload", (e) => {
  if (!dirty) return;
  e.preventDefault();
  e.returnValue = "";
});
</script>
