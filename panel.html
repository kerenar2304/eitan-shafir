<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/svg+xml" href="public/assets/es-mark.svg" />
<title>ניהול תוכן | איתן שפיר ושות׳</title>
<style>
  @font-face{font-family:"Talent FS";src:url("public/fonts/Talent_FS-Light.woff2") format("woff2");font-weight:300;font-display:swap}
  @font-face{font-family:"Talent FS";src:url("public/fonts/Talent_FS-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Talent FS";src:url("public/fonts/Talent_FS-Demibold.woff2") format("woff2");font-weight:600;font-display:swap}
  :root{--navy:#050E40;--navy-2:#0A1555;--gold:#B99E64;--gold-ink:#8A6F35;--cream:#FFFCFC;--line:#E6DCC6;--grey:#6b7280}
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;min-height:100dvh;background:#F3F4F8;color:var(--navy);font-family:"Talent FS",system-ui,sans-serif}

  /* ---- gate ---- */
  .gate{min-height:100dvh;display:grid;place-items:center;background:var(--navy);padding:24px}
  .gate-box{width:min(380px,100%);background:var(--cream);border-radius:12px;padding:32px 28px;text-align:center;box-shadow:0 24px 60px rgb(0 0 0 /.35)}
  .gate-box img{width:74px;height:auto;margin-bottom:18px}
  .gate-box h1{margin:0 0 6px;font-size:24px;font-weight:600}
  .gate-box p{margin:0 0 22px;font-size:16px;color:var(--grey);line-height:1.6}
  .gate-box input{width:100%;font:inherit;font-size:18px;text-align:center;letter-spacing:.2em;padding:11px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .gate-box button{width:100%;margin-top:12px;font:inherit;font-size:17px;padding:11px;border:0;border-radius:6px;background:var(--gold);color:var(--navy);cursor:pointer}
  .gate-err{margin-top:10px;font-size:15px;color:#b91c1c;min-height:20px}

  /* ---- shell ---- */
  header.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;background:var(--navy);color:#fff}
  header.bar img{height:30px;width:auto}
  header.bar h1{margin:0;font-size:19px;font-weight:600}
  .bar .spacer{flex:1}
  .bar button{font:inherit;font-size:16px;padding:9px 18px;border:0;border-radius:6px;cursor:pointer}
  .btn-save{background:var(--gold);color:var(--navy)}
  .btn-ghost{background:transparent;color:#fff;border:1px solid rgb(255 255 255 /.4)}
  .btn-save:hover,.btn-ghost:hover{filter:brightness(1.08)}
  .status{font-size:15px;color:#E8D4A8;min-height:20px}

  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 20px 0;max-width:1100px;margin:0 auto}
  nav.tabs button{font:inherit;font-size:15px;padding:8px 15px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
  nav.tabs button[aria-selected="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

  main{max-width:1100px;margin:0 auto;padding:18px 20px 80px}
  .hint{font-size:14px;color:var(--grey);line-height:1.65;margin:10px 0 18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:14px;color:var(--gold-ink);margin-bottom:5px}
  .field input,.field textarea{width:100%;font:inherit;font-size:16px;line-height:1.6;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--navy);resize:vertical}
  .field input:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row .field{flex:1 1 180px}
  .card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:16px;margin-bottom:14px}
  .card header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .card h3{margin:0;font-size:17px;font-weight:600;flex:1}
  .mini{font:inherit;font-size:13px;padding:6px 11px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--gold-ink);cursor:pointer}
  .mini:hover{border-color:var(--gold)}
  .mini.del:hover{border-color:#b91c1c;color:#b91c1c}
  .add{font:inherit;font-size:16px;padding:10px 18px;border-radius:6px;border:1px dashed var(--gold);background:#fff;color:var(--gold-ink);cursor:pointer;width:100%}
  .add:hover{background:#FFFBF2}
  details.sub{border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px 14px;margin-bottom:10px}
  details.sub>summary{cursor:pointer;font-size:16px;font-weight:600;padding:2px 0}
  details.sub[open]>summary{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
  .block{border:1px solid var(--line);border-right:4px solid var(--gold);border-radius:8px;padding:12px;margin-bottom:10px;background:#FDFCF9}
  .block .kind{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;color:var(--gold-ink)}
  .block select{font:inherit;font-size:14px;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:#fff}
  .save-note{margin-top:22px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:16px;font-size:15px;line-height:1.7;color:var(--navy)}
  .save-note b{color:var(--gold-ink)}
</style>
</head>
<body>

<div id="gate" class="gate">
  <form class="gate-box" id="gateForm">
    <img src="public/assets/es-mark.svg" alt="" />
    <h1>ניהול תוכן</h1>
    <p>האתר של איתן שפיר ושות׳. יש להזין את הסיסמה כדי להמשיך.</p>
    <input id="pass" type="password" inputmode="numeric" autocomplete="current-password" aria-label="סיסמה" />
    <button type="submit">כניסה</button>
    <p class="gate-err" id="gateErr" role="status"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="bar">
    <img src="public/assets/logo-light.svg" alt="איתן שפיר ושות׳" />
    <h1>ניהול תוכן</h1>
    <span class="spacer"></span>
    <span class="status" id="status" role="status"></span>
    <button class="btn-ghost" id="preview" type="button">צפייה באתר</button>
    <button class="btn-save" id="save" type="button">שמירת שינויים</button>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="fields"></main>
</div>

<script>
/* ------------------------------------------------------------------ *
 *  Content panel for the site. It edits a copy of the site's texts,
 *  and hands the result back as a file that gets published to the site.
 * ------------------------------------------------------------------ */

const PASSWORD = "123456";

const LABELS = {
  home: { _name: "דף הבית",
    heroLine1: "כותרת ראשית, שורה 1", heroLine2: "כותרת ראשית, שורה 2",
    heroSubA: "כותרת משנה, שורה 1", heroSubB: "כותרת משנה, שורה 2", heroButton: "כפתור בהירו",
    servicesTitle: "כותרת תחומי התמחות", servicesIntroA: "פתיח התמחות, שורה 1", servicesIntroB: "פתיח התמחות, שורה 2",
    differenceTitle: "כותרת סקשן הגישה", clientsTitle: "כותרת לקוחות",
    clientsIntroA: "פתיח לקוחות, שורה 1", clientsIntroB: "פתיח לקוחות, שורה 2",
    aboutTitle: "כותרת על המשרד", aboutP1: "על המשרד, פסקה 1", aboutP2: "על המשרד, פסקה 2", aboutP3: "על המשרד, פסקה 3",
    aboutButton: "כפתור על המשרד",
    articlesTitleA: "כותרת מאמרים, שורה 1", articlesTitleB: "כותרת מאמרים, שורה 2", articlesButton: "כפתור מאמרים" },
  about: { _name: "אודות",
    _hint: "פסקאות הפתיחה, המספרים, ענפי הלקוחות והשותפים. עריכת אנשי הצוות נמצאת בלשונית נפרדת.",
    officeTitle: "כותרת הסקשן", officeP1: "פסקה 1", officeP2: "פסקה 2", officeP3: "פסקה 3",
    stats: "המספרים", to: "מספר", suffix: "סימן אחרי המספר", label: "תיאור",
    sectorsTitle: "כותרת ענפי הלקוחות", sectors: "ענפי לקוחות",
    partners: "שותפים", name: "שם", role: "תפקיד", img: "נתיב תמונה",
    p1: "פסקה 1", p2: "פסקה 2", p3: "פסקה 3", highlights: "שלוש הקוביות", value: "כותרת הקובייה",
    teamTitle: "כותרת הצוות", teamIntro: "פסקת פתיחה לצוות" },
  servicesPage: { _name: "תחומי התמחות",
    _hint: "הכותרת והפתיח של העמוד, ושתי המחלקות.",
    title: "כותרת העמוד", introA: "פסקה 1", introB: "פסקה 2",
    departments: "מחלקות", tab: "שם הלשונית", mobileTab: "שם הלשונית במובייל", lead: "בראשות" },
  serviceDetails: { _name: "תוכן התחומים",
    _hint: "מה שנפתח בלחיצה על תחום. שם התחום עצמו נקבע בקוד, כי הוא מקשר בין החוצץ לתוכן.",
    title: "כותרת מלאה (לא חובה)", subtitle: "כותרת משנה", paragraphs: "פסקאות",
    listTitle: "כותרת הרשימה", list: "פריטי הרשימה", note: "הערה בסוף" },
  contact: { _name: "יצירת קשר", title: "כותרת", intro: "פסקת פתיחה", privacyNote: "הערת פרטיות", privacyLink: "טקסט הקישור", submit: "כפתור שליחה" },
  articlesPage: { _name: "עמוד מאמרים", title: "כותרת", intro: "פסקת פתיחה", featuredTab: "לשונית המאמר האחרון", featuredButton: "כפתור קריאה" },
};

const LONG = ["intro","excerpt","aboutP1","aboutP2","aboutP3","officeP1","officeP2","officeP3","p1","p2","p3",
  "teamIntro","introA","introB","servicesIntroA","servicesIntroB","clientsIntroA","clientsIntroB",
  "privacyNote","heroSubA","heroSubB","subtitle","note","paragraphs"];
const SHORT = ["tag","date","to","suffix","img","slug","role","value"];

const BLOCK_KINDS = [
  ["p", "פסקה"],
  ["h2", "כותרת משנה"],
  ["lead", "פסקת פתיחה"],
  ["list", "רשימה"],
  ["quote", "ציטוט מודגש"],
  ["callout", "תיבת הדגשה"],
  ["note", "הערה"],
];

let data = null;        // { content: {...}, bodies: { slug: [blocks] } }
let active = "home";
let dirty = false;

const $ = (id) => document.getElementById(id);
const setStatus = (m) => { $("status").textContent = m; };
const touch = () => { dirty = true; setStatus("יש שינויים שלא נשמרו"); };

/* ---------- gate ---------- */
$("gateForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if ($("pass").value.trim() === PASSWORD) {
    sessionStorage.setItem("es-panel", "1");
    open_();
  } else {
    $("gateErr").textContent = "סיסמה שגויה";
  }
});
if (sessionStorage.getItem("es-panel") === "1") open_();

function open_() {
  $("gate").hidden = true;
  $("app").hidden = false;
  load();
}

/* ---------- data ---------- */
async function load() {
  setStatus("טוען…");
  const saved = localStorage.getItem("es-panel-draft");
  const res = await fetch("panel-data.json", { cache: "no-store" });
  data = await res.json();
  if (saved) {
    try {
      const draft = JSON.parse(saved);
      if (confirm("נמצאה טיוטה שלא נשמרה מהפעם הקודמת. לטעון אותה?")) data = draft;
      else localStorage.removeItem("es-panel-draft");
    } catch { /* a broken draft is simply ignored */ }
  }
  renderTabs();
  render();
  setStatus("");
}

function keepDraft() {
  try { localStorage.setItem("es-panel-draft", JSON.stringify(data)); } catch { /* storage full or blocked */ }
}

/* ---------- small builders ---------- */
function field(labelText, value, onInput, long) {
  const wrap = document.createElement("div");
  wrap.className = "field";
  const label = document.createElement("label");
  label.textContent = labelText;
  const input = document.createElement(long ? "textarea" : "input");
  if (long) input.rows = Math.min(8, Math.ceil(String(value || "").length / 60) + 1);
  input.value = value ?? "";
  input.addEventListener("input", () => { onInput(input.value); touch(); keepDraft(); });
  label.appendChild(input);
  wrap.appendChild(label);
  return wrap;
}

function mini(text, cls, onClick) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "mini " + cls;
  b.textContent = text;
  b.onclick = onClick;
  return b;
}

function blankLike(sample) {
  if (typeof sample === "string") return "";
  if (typeof sample === "number") return 0;
  if (Array.isArray(sample)) return sample.length ? [blankLike(sample[0])] : [];
  const out = {};
  Object.keys(sample).forEach((k) => (out[k] = blankLike(sample[k])));
  return out;
}

const labelFor = (key) => (LABELS[active] && LABELS[active][key]) || key;

/* ---------- generic value editor ---------- */
function renderValue(box, key, holder, prop) {
  const value = holder[prop];

  if (value === null || typeof value !== "object") {
    const isNumber = typeof value === "number";
    box.appendChild(field(labelFor(key), value, (v) => (holder[prop] = isNumber ? Number(v) || 0 : v), LONG.includes(key)));
    return;
  }

  if (Array.isArray(value)) {
    const card = document.createElement("div");
    card.className = "card";
    const head = document.createElement("header");
    const h = document.createElement("h3");
    h.textContent = labelFor(key);
    head.appendChild(h);
    head.appendChild(mini("הוספה +", "", () => {
      value.push(value.length ? blankLike(value[value.length - 1]) : "");
      touch(); keepDraft(); render();
    }));
    card.appendChild(head);

    value.forEach((item, i) => {
      if (item === null || typeof item !== "object") {
        const row = document.createElement("div");
        row.className = "row";
        row.style.alignItems = "flex-end";
        const f = field(String(i + 1), item, (v) => (value[i] = v), LONG.includes(key));
        f.style.flex = "1 1 200px";
        row.appendChild(f);
        const del = mini("מחיקה", "del", () => { value.splice(i, 1); touch(); keepDraft(); render(); });
        del.style.marginBottom = "14px";
        row.appendChild(del);
        card.appendChild(row);
        return;
      }
      const sub = document.createElement("div");
      sub.className = "card";
      const subHead = document.createElement("header");
      const t = document.createElement("h3");
      t.textContent = (i + 1) + ". " + (item.name || item.title || item.tab || item.value || item.label || "");
      subHead.appendChild(t);
      subHead.appendChild(mini("מחיקה", "del", () => { value.splice(i, 1); touch(); keepDraft(); render(); }));
      sub.appendChild(subHead);
      renderObject(sub, item);
      card.appendChild(sub);
    });
    box.appendChild(card);
    return;
  }

  const card = document.createElement("div");
  card.className = "card";
  const h = document.createElement("h3");
  h.textContent = labelFor(key);
  card.appendChild(h);
  renderObject(card, value);
  box.appendChild(card);
}

function renderObject(box, obj) {
  let row = null;
  Object.keys(obj).forEach((k) => {
    const v = obj[k];
    if (SHORT.includes(k) && (v === null || typeof v !== "object")) {
      if (!row) { row = document.createElement("div"); row.className = "row"; box.appendChild(row); }
      renderValue(row, k, obj, k);
      return;
    }
    row = null;
    renderValue(box, k, obj, k);
  });
}

/* ---------- team ---------- */
function renderTeam(box) {
  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = "סדר אנשי הצוות כאן הוא הסדר שבו הם מופיעים בעמוד אודות. בשדה התמונה רושמים את נתיב הקובץ, למשל /assets/team/katia-higer.webp. להוספת תמונה חדשה יש לשלוח לי את הקובץ.";
  box.appendChild(hint);

  const team = data.content.about.team;
  team.forEach((m, i) => {
    const card = document.createElement("div");
    card.className = "card";
    const head = document.createElement("header");
    const h = document.createElement("h3");
    h.textContent = (i + 1) + ". " + (m.name || "איש צוות חדש");
    head.appendChild(h);
    head.appendChild(mini("↑", "", () => { if (i > 0) { [team[i - 1], team[i]] = [team[i], team[i - 1]]; touch(); keepDraft(); render(); } }));
    head.appendChild(mini("↓", "", () => { if (i < team.length - 1) { [team[i + 1], team[i]] = [team[i], team[i + 1]]; touch(); keepDraft(); render(); } }));
    head.appendChild(mini("מחיקה", "del", () => { if (confirm("למחוק את " + (m.name || "איש הצוות") + "?")) { team.splice(i, 1); touch(); keepDraft(); render(); } }));
    card.appendChild(head);

    const row = document.createElement("div");
    row.className = "row";
    row.appendChild(field("שם", m.name, (v) => { m.name = v; h.textContent = (i + 1) + ". " + v; }));
    row.appendChild(field("תפקיד", m.role, (v) => (m.role = v)));
    card.appendChild(row);
    card.appendChild(field("נתיב תמונה (אפשר להשאיר ריק)", m.img, (v) => (m.img = v)));
    box.appendChild(card);
  });

  const add = document.createElement("button");
  add.type = "button";
  add.className = "add";
  add.textContent = "הוספת איש צוות +";
  add.onclick = () => { team.push({ name: "", role: "", img: "" }); touch(); keepDraft(); render(); };
  box.appendChild(add);
}

/* ---------- articles ---------- */
function slugify(title) {
  const base = String(title || "").trim().replace(/\s+/g, "-").replace(/["'״׳.,:;()]/g, "");
  return base ? "article-" + Date.now().toString(36) : "article-" + Date.now().toString(36);
}

function renderArticles(box) {
  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = "המאמר הראשון ברשימה הוא זה שמוצג כ״מאמר האחרון״ בעמוד המאמרים ובדף הבית. כל מאמר בנוי מפסקאות וכותרות שאפשר להוסיף, למחוק ולהזיז. לתמונה חדשה יש לשלוח לי את הקובץ, ובינתיים אפשר להשאיר את נתיב התמונה של מאמר קיים.";
  box.appendChild(hint);

  const arts = data.content.articles;
  arts.forEach((a, i) => {
    const det = document.createElement("details");
    det.className = "sub";
    if (i === 0) det.open = true;
    const sum = document.createElement("summary");
    sum.textContent = (i + 1) + ". " + (a.title || "מאמר חדש");
    det.appendChild(sum);

    const head = document.createElement("div");
    head.className = "row";
    head.style.marginBottom = "6px";
    head.appendChild(mini("↑ קדימה", "", () => { if (i > 0) { [arts[i - 1], arts[i]] = [arts[i], arts[i - 1]]; touch(); keepDraft(); render(); } }));
    head.appendChild(mini("↓ אחורה", "", () => { if (i < arts.length - 1) { [arts[i + 1], arts[i]] = [arts[i], arts[i + 1]]; touch(); keepDraft(); render(); } }));
    head.appendChild(mini("מחיקת המאמר", "del", () => {
      if (confirm("למחוק את המאמר ״" + (a.title || "") + "״?")) {
        delete data.bodies[a.slug];
        arts.splice(i, 1);
        touch(); keepDraft(); render();
      }
    }));
    det.appendChild(head);

    det.appendChild(field("כותרת", a.title, (v) => { a.title = v; sum.textContent = (i + 1) + ". " + v; }));
    const row = document.createElement("div");
    row.className = "row";
    row.appendChild(field("נושא", a.tag, (v) => (a.tag = v)));
    row.appendChild(field("תאריך", a.date, (v) => (a.date = v)));
    det.appendChild(row);
    det.appendChild(field("מאת", a.author, (v) => (a.author = v)));
    det.appendChild(field("תקציר (מופיע בכרטיס)", a.excerpt, (v) => (a.excerpt = v), true));
    det.appendChild(field("נתיב תמונה", a.img, (v) => (a.img = v)));

    const bodyTitle = document.createElement("p");
    bodyTitle.className = "hint";
    bodyTitle.style.margin = "16px 0 8px";
    bodyTitle.textContent = "גוף המאמר";
    det.appendChild(bodyTitle);

    const body = (data.bodies[a.slug] = data.bodies[a.slug] || []);
    body.forEach((b, j) => det.appendChild(renderBlock(body, b, j)));

    const add = document.createElement("button");
    add.type = "button";
    add.className = "add";
    add.textContent = "הוספת פסקה +";
    add.onclick = () => { body.push({ t: "p", text: "" }); touch(); keepDraft(); render(); };
    det.appendChild(add);

    box.appendChild(det);
  });

  const addArt = document.createElement("button");
  addArt.type = "button";
  addArt.className = "add";
  addArt.style.marginTop = "10px";
  addArt.textContent = "מאמר חדש +";
  addArt.onclick = () => {
    const slug = slugify("");
    const today = new Date().toLocaleDateString("he-IL").replace(/\./g, "/");
    arts.unshift({ slug, title: "", tag: "", date: today, img: arts[0] ? arts[0].img : "", author: "", excerpt: "" });
    data.bodies[slug] = [{ t: "lead", text: "" }, { t: "p", text: "" }];
    touch(); keepDraft(); render();
  };
  box.appendChild(addArt);
}

function renderBlock(body, b, j) {
  const wrap = document.createElement("div");
  wrap.className = "block";

  const kind = document.createElement("div");
  kind.className = "kind";
  const sel = document.createElement("select");
  BLOCK_KINDS.forEach(([v, t]) => {
    const o = document.createElement("option");
    o.value = v; o.textContent = t; o.selected = b.t === v;
    sel.appendChild(o);
  });
  sel.onchange = () => {
    b.t = sel.value;
    if (b.t === "list" && !b.items) { b.items = [""]; delete b.text; }
    if (b.t !== "list" && !b.text) { b.text = ""; delete b.items; }
    if (b.t !== "callout") delete b.title;
    touch(); keepDraft(); render();
  };
  kind.appendChild(sel);
  kind.appendChild(mini("↑", "", () => { if (j > 0) { [body[j - 1], body[j]] = [body[j], body[j - 1]]; touch(); keepDraft(); render(); } }));
  kind.appendChild(mini("↓", "", () => { if (j < body.length - 1) { [body[j + 1], body[j]] = [body[j], body[j + 1]]; touch(); keepDraft(); render(); } }));
  kind.appendChild(mini("מחיקה", "del", () => { body.splice(j, 1); touch(); keepDraft(); render(); }));
  wrap.appendChild(kind);

  if (b.t === "callout") wrap.appendChild(field("כותרת התיבה", b.title, (v) => (b.title = v)));

  if (b.t === "list") {
    b.items = b.items || [""];
    b.items.forEach((item, k) => {
      const row = document.createElement("div");
      row.className = "row";
      row.style.alignItems = "flex-end";
      const f = field("פריט " + (k + 1), item, (v) => (b.items[k] = v));
      f.style.flex = "1 1 200px";
      row.appendChild(f);
      const del = mini("מחיקה", "del", () => { b.items.splice(k, 1); touch(); keepDraft(); render(); });
      del.style.marginBottom = "14px";
      row.appendChild(del);
      wrap.appendChild(row);
    });
    const add = mini("הוספת פריט +", "", () => { b.items.push(""); touch(); keepDraft(); render(); });
    wrap.appendChild(add);
  } else {
    wrap.appendChild(field("טקסט", b.text, (v) => (b.text = v), true));
  }
  return wrap;
}

/* ---------- shell ---------- */
function render() {
  const box = $("fields");
  box.innerHTML = "";

  if (active === "team") { renderTeam(box); return; }
  if (active === "articles") { renderArticles(box); return; }

  const meta = LABELS[active];
  if (meta && meta._hint) {
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = meta._hint;
    box.appendChild(hint);
  }

  const group = data.content[active];
  const values = Object.values(group);
  if (!Array.isArray(group) && values.length && values.every((v) => v && typeof v === "object" && !Array.isArray(v))) {
    Object.keys(group).forEach((key) => {
      const d = document.createElement("details");
      d.className = "sub";
      const s = document.createElement("summary");
      s.textContent = key.replace("\n", " ");
      d.appendChild(s);
      renderObject(d, group[key]);
      box.appendChild(d);
    });
    return;
  }
  renderObject(box, group);
}

function renderTabs() {
  const tabs = $("tabs");
  tabs.innerHTML = "";
  const order = ["home", "about", "team", "servicesPage", "serviceDetails", "articlesPage", "articles", "contact"];
  order.forEach((key) => {
    if (key !== "team" && key !== "articles" && !data.content[key]) return;
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(key === active));
    b.textContent = key === "team" ? "אנשי הצוות" : key === "articles" ? "מאמרים" : (LABELS[key] && LABELS[key]._name) || key;
    b.onclick = () => { active = key; renderTabs(); render(); window.scrollTo({ top: 0 }); };
    tabs.appendChild(b);
  });
}

/* ---------- saving ---------- */
$("save").onclick = () => {
  const text = JSON.stringify(data, null, 2);
  const blob = new Blob([text], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 16).replace("T", "-").replace(":", "");
  a.href = url;
  a.download = `eitan-shafir-content-${stamp}.json`;
  a.click();
  URL.revokeObjectURL(url);
  dirty = false;
  setStatus("הקובץ ירד למחשב");

  const note = document.createElement("div");
  note.className = "save-note";
  note.innerHTML =
    "<b>מה עכשיו?</b><br />הקובץ שירד מכיל את כל התוכן המעודכן. יש לשלוח אותו לקרן, והשינויים יעלו לאתר." +
    "<br />הטיוטה נשמרת גם בדפדפן הזה, כך שאפשר לסגור ולחזור להמשיך.";
  $("fields").prepend(note);
  window.scrollTo({ top: 0, behavior: "smooth" });
};

$("preview").onclick = () => window.open("index.html", "_blank", "noopener");

window.addEventListener("beforeunload", (e) => {
  if (!dirty) return;
  e.preventDefault();
  e.returnValue = "";
});
</script>
</body>
