<style>
/* ------------------------------------------------------------------ */
/*  Motion & interaction layer — plain CSS, shared by the app and the   */
/*  local preview file. Keep it free of Tailwind directives.            */
/* ------------------------------------------------------------------ */

/* ---------- client logo marquee ---------- */
@keyframes marquee-left {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
@keyframes marquee-right {
  from { transform: translateX(-50%); }
  to { transform: translateX(0); }
}
.marquee-track {
  display: flex;
  width: max-content;
  animation: marquee-left 90s linear infinite; /* each half holds the row twice */
}
.marquee-track-reverse {
  animation-name: marquee-right;
}
.marquee-mask {
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
}
.marquee-mask:hover .marquee-track {
  animation-play-state: paused;
}

/* ---------- scroll reveal ---------- */
[data-reveal] {
  opacity: 0;
  transform: translate3d(0, 28px, 0);
  transition: opacity 0.8s cubic-bezier(0.22, 0.61, 0.36, 1), transform 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
  transition-delay: var(--reveal-delay, 0ms);
}
[data-reveal="right"] { transform: translate3d(34px, 0, 0); }
[data-reveal="left"] { transform: translate3d(-34px, 0, 0); }
[data-reveal="zoom"] { transform: scale(0.94); }
[data-reveal].is-visible {
  opacity: 1;
  transform: none;
}

/* ---------- hero entrance ---------- */
@keyframes hero-in {
  from { opacity: 0; transform: translate3d(0, 34px, 0); }
  to { opacity: 1; transform: none; }
}
.hero-in {
  opacity: 0;
  animation: hero-in 1s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  animation-delay: var(--hero-delay, 0ms);
}
@keyframes scroll-cue {
  0%, 100% { transform: translateY(0); opacity: 0.55; }
  50% { transform: translateY(9px); opacity: 1; }
}
.scroll-cue { animation: scroll-cue 2.2s ease-in-out infinite; }

/* ---------- buttons: rolling label (after blumental-chadad) ---------- */
.roll { position: relative; display: block; overflow: hidden; }
.roll-a, .roll-b { display: block; transition: transform 0.8s cubic-bezier(0.76, 0, 0.24, 1); }
.roll-b { position: absolute; top: 100%; inset-inline: 0; }
.btn-gold:hover .roll-a, .btn-gold:hover .roll-b,
.btn-gold:focus-visible .roll-a, .btn-gold:focus-visible .roll-b,
.roll-link:hover .roll-a, .roll-link:hover .roll-b,
.roll-link:focus-visible .roll-a, .roll-link:focus-visible .roll-b { transform: translateY(-100%); }
.btn-gold { position: relative; transition: box-shadow 0.5s ease, filter 0.5s ease; }
.btn-gold:hover { filter: brightness(1.05); box-shadow: 0 10px 24px rgba(5, 14, 64, 0.35); }
/* header links: the label rolls and an underline draws in */
.roll-link { position: relative; display: inline-block; }
.roll-link::after {
  content: "";
  position: absolute;
  bottom: -3px;
  inset-inline-start: 0;
  width: 0;
  height: 1px;
  background-color: currentColor;
  transition: width 0.6s cubic-bezier(0.76, 0, 0.24, 1);
}
.roll-link:hover::after, .roll-link:focus-visible::after { width: 100%; }

/* ---------- links: sweeping underline ---------- */
.link-sweep {
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat;
  background-position: 100% 100%;
  background-size: 0% 1px;
  transition: background-size 0.6s cubic-bezier(0.76, 0, 0.24, 1), color 0.3s ease;
  padding-bottom: 2px;
}
.link-sweep:hover { background-size: 100% 1px; }

/* ---------- header: no background, always in place; ink follows the page behind it ---------- */
.logo-ink-light, .logo-ink-dark, .hdr-ink { transition: opacity 0.45s ease, color 0.45s ease; }
.hdr-ink { color: hsl(var(--ice)); }
.logo-ink-dark { opacity: 0; }
.header-on-light .logo-ink-light { opacity: 0; }
.header-on-light .logo-ink-dark { opacity: 1; }
.header-on-light .hdr-ink { color: hsl(var(--navy)); }

/* ---------- folder cards ---------- */
.folder-card {
  transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
}
.folder-card svg { transition: filter 0.35s ease; }
.folder-card .folder-paper { transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1), border-color 0.35s ease; }
.folder-card:hover { transform: translateY(-8px); }
.folder-card:hover svg { filter: drop-shadow(0 18px 20px rgba(5, 14, 64, 0.45)); }
.folder-card:hover .folder-paper { transform: translateY(-7px); border-color: rgba(230, 208, 156, 1); }

/* ---------- tab panel swap ---------- */
@keyframes panel-in {
  from { opacity: 0; transform: translate3d(0, 18px, 0); }
  to { opacity: 1; transform: none; }
}
.panel-in { animation: panel-in 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
.tab-btn { transition: background-color 0.35s ease, color 0.35s ease, transform 0.25s ease, box-shadow 0.35s ease; }
.tab-btn:hover { transform: translateY(-2px); }
.tab-btn[aria-selected="true"] { box-shadow: 0 10px 26px rgba(5, 14, 64, 0.4); }

/* ---------- article cards ---------- */
.article-card {
  transition: transform 0.4s cubic-bezier(0.22, 0.61, 0.36, 1), background-color 0.4s ease, box-shadow 0.4s ease;
}
.article-card img { transition: transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1); }
.article-card:hover { transform: translateY(-8px); background-color: rgba(255, 255, 255, 0.16); box-shadow: 0 22px 34px rgba(0, 0, 0, 0.3); }
.article-card:hover img { transform: scale(1.07); }

/* ---------- form fields ---------- */
.field-anim {
  transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
}
.field-anim:focus {
  background-color: rgba(255, 255, 255, 0.16);
  box-shadow: 0 0 0 2px rgba(185, 158, 100, 0.8);

/* ---------- photos / images ---------- */
.zoom-soft { transform-origin: bottom center; transition: transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1); }
.zoom-soft:hover { transform: scale(1.02); }

@media (prefers-reduced-motion: reduce) {

  .scroll-cue,
  .hero-in { animation: none; }

  .folder-card, .article-card, .zoom-soft, .logo-ink-light, .logo-ink-dark, .hdr-ink { transition: none; }
}

/* ---------- staggered group (children reveal with the parent) ---------- */
[data-reveal-group] > * {
  opacity: 0;
  transform: translate3d(0, 26px, 0);

.es-divider .es-line--from-left,

.lines-draw .es-line--from-right { transform-origin: right center; }
.es-divider .es-mark {

.es-divider.is-visible .es-line,

.es-divider.is-visible .es-mark { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  .es-divider .es-line,
  .lines-draw .es-line { transform: none; transition: none; }
  .es-divider .es-mark { opacity: 1; transform: none; transition: none; }
}

/* ---------- carousel arrows ---------- */
.carousel-arrow {

.carousel-arrow:not(:disabled):hover {

.carousel-arrow:disabled {

/* ---------- folder pop-up ---------- */
@keyframes modal-backdrop-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-backdrop-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes modal-panel-in {

/* ---------- typography: no single-word last lines ---------- */
h1, h2, h3, h4 { text-wrap: balance; }
p, li, blockquote { text-wrap: pretty; }

/* ---------- justified body text ---------- */
/* CSS has no "maximum word spacing", so justification only kicks in where lines are
   long enough (~50+ characters) for the gaps to stay small and even. On narrow
   columns (phones, pop-ups on phones) text stays right-aligned with a balanced rag. */
@media (min-width: 768px) {

/* ---------- About page: misc ---------- */
.sector-pill { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }

.portrait-frame { transition: transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1); }

.team-card:hover .team-card-img { transform: scale(1.04); }

.folder-row:focus-visible, .service-nav:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
.service-nav { transition: background-color 0.3s ease, color 0.3s ease; }

@media (min-width: 1024px) {

/* ------------------------------------------------------------------ */
/*  Book-style justified paragraph                                     */
/* ------------------------------------------------------------------ */

type BookLine = { from: number; to: number; ws: number; ls: number; last: boolean };

/** book-like limits, as a fraction of the font size (word shrink is a fraction of a space) */
const BOOK = { maxWordStretch: 0.25, maxLetterStretch: 0.03, maxLetterShrink: 0.015, wordShrink: 0.2 };

function setBookLines(el: HTMLElement, words: string[]): BookLine[] {
  const spans = Array.from(el.querySelectorAll<HTMLElement>("[data-w]"));
  const space = el.querySelector<HTMLElement>("[data-space]")?.offsetWidth ?? 0;
  const fs = parseFloat(getComputedStyle(el).fontSize);
  const W = el.clientWidth;
  const n = words.length;
  if (!W || !spans.length || !space) return [];

  const wd = spans.map((s) => s.offsetWidth);
  const chars = (i: number, j: number) => words.slice(i, j + 1).join(" ").length;
  const maxWs = BOOK.maxWordStretch * fs;
  const maxLs = BOOK.maxLetterStretch * fs;
  const minWs = -BOOK.wordShrink * space;
  const minLs = -BOOK.maxLetterShrink * fs;

  // greedy breaking that may squeeze one more word in when that reads better than stretching
  const lines: { i: number; j: number; natural: number }[] = [];
  let i = 0;
  while (i < n) {
    let j = i;
    let natural = wd[i];
    while (j + 1 < n) {
      const next = natural + space + wd[j + 1];
      if (next <= W) {
        natural = next;
        j++;
        continue;
      }
      const shrinkCap = -((j + 1 - i) * minWs + chars(i, j + 1) * minLs);
      const gapsA = j - i;
      const stretchCap = gapsA * maxWs + chars(i, j) * maxLs;
      const badShrink = (next - W) / shrinkCap;
      const badStretch = gapsA ? (W - natural) / stretchCap : Infinity;
      if (next - W <= shrinkCap && badShrink < badStretch) {
        natural = next;
        j++;
      }
      break;
    }
    lines.push({ i, j, natural });
    i = j + 1;
  }

  return lines.map(({ i, j, natural }, k) => {
    const last = k === lines.length - 1;
    const gaps = j - i;
    const cs = chars(i, j);
    let ws = 0;
    let ls = 0;
    if (!last && gaps > 0) {
      const delta = W - natural;
      if (delta >= 0) {
        ws = Math.min(maxWs, delta / gaps);
        ls = Math.min(maxLs, (delta - ws * gaps) / cs);
        ws += (delta - ws * gaps - ls * cs) / gaps; // anything left goes back to the word gaps
      } else {
        ws = Math.max(minWs, delta / gaps);
        ls = (delta - ws * gaps) / cs;
      }
    }
    return { from: i, to: j, ws, ls, last };
  });
}

/**
 * Justified paragraph set like a book page: each line gets its own word and letter spacing
 * within tight limits, instead of the browser stretching only the word gaps.
 * Below 768px it stays right aligned.
 */
function BookText({ text, className }: { text: string; className?: string }) {
  const ref = useRef<HTMLParagraphElement>(null);
  const words = text.trim().split(/\s+/);
  const [lines, setLines] = useState<BookLine[] | null>(null);
  const widthRef = useRef(0);

  useLayoutEffect(() => {
    const el = ref.current;
    if (!el || lines !== null) return;
    if (!window.matchMedia("(min-width: 768px)").matches) return;
    widthRef.current = el.clientWidth;
    setLines(setBookLines(el, words));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [lines, text]);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const redo = () => setLines(null);
    const ro = new ResizeObserver(() => {
      if (Math.abs(el.clientWidth - widthRef.current) > 0.5) redo();
    });
    ro.observe(el);
    document.fonts?.ready.then(redo);
    return () => ro.disconnect();
  }, [text]);

  if (!lines || !lines.length) {
    // measuring pass: natural spacing, one span per word
    return (
      <p ref={ref} className={cn("book-text", className)} style={{ textAlign: "right", wordSpacing: "normal" }}>
        {words.map((w, k) => (
          <span key={k}>
            <span data-w>{w}</span>
            {k < words.length - 1 ? " " : ""}
          </span>
        ))}
        <span data-space aria-hidden style={{ position: "absolute", visibility: "hidden", whiteSpace: "pre" }}>
          {" "}
        </span>
      </p>
    );
  }

  return (
    <p ref={ref} className={cn("book-text", className)} style={{ textAlign: "right" }}>
      {lines.map((l, k) => (
        <span
          key={k}
          className="block"
          style={
            l.last
              ? { wordSpacing: "normal" }
              : {
                  whiteSpace: "nowrap",
                  wordSpacing: `${l.ws.toFixed(2)}px`,
                  letterSpacing: `${l.ls.toFixed(3)}px`,
                  textAlign: "justify",
                  textAlignLast: "justify",
                }
          }
        >
          {words.slice(l.from, l.to + 1).join(" ")}
        </span>
      ))}
    </p>
  );
}

/**
 * Opening screen (after blumental-chadad, in Eitan's language): the gold ES mark rises into view on deep navy
 * with a thin gold line drawing under it, then the screen lifts away. Plays when someone enters the site (from outside,
 * a typed address or a bookmark) and on a browser refresh; never when moving between the site's own pages.
 * Skipped for reduced motion.
 * While it runs, <html> carries .intro-running so the hero's own entrance waits for it.
 */
/** module state: resets on every full load, survives in-app (router) navigation */
let introPlayed = false;

/** a refresh, or arriving from outside the site (not a click from one of its own pages, not back / forward) */
function isSiteEntry() {
  const nav = performance.getEntriesByType("navigation")[0] as PerformanceNavigationTiming | undefined;
  if (nav?.type === "reload") return true;
  if (nav?.type === "back_forward") return false;
  try {
    return !document.referrer || new URL(document.referrer).origin !== window.location.origin;
  } catch {
    return true;
  }
}

function IntroLoader() {
  const [phase, setPhase] = useState<"on" | "out" | "off">(() => {
    if (typeof window === "undefined" || introPlayed || !isSiteEntry()) return "off";
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return "off";
    return "on";
  });

  useLayoutEffect(() => {
    if (phase !== "on") return;
    const root = document.documentElement;
    root.classList.add("intro-running");
    introPlayed = true;
    const lift = window.setTimeout(() => {
      setPhase("out");
      root.classList.remove("intro-running");
    }, 1900);
    const done = window.setTimeout(() => setPhase("off"), 2800);
    return () => {
      window.clearTimeout(lift);
      window.clearTimeout(done);
      root.classList.remove("intro-running");
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  if (phase === "off") return null;
  return (
    <div className={cn("intro fixed inset-0 z-[100] grid place-items-center bg-navy-deep", phase === "out" && "is-out")} aria-hidden>
      <div className="flex flex-col items-center">
        <img src="public/assets/es-mark.svg" alt="" className="intro-mark h-auto w-[92px] md:w-[110px]" />
        <span className="intro-line mt-8 block h-px w-[150px] bg-gold md:w-[180px]" />
      </div>
    </div>
  );
}

/** a small soft gold light that trails the mouse (desktop mouse only, off for reduced motion) */
function CursorLight() {
  const ref = useRef<HTMLDivElement>(null);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    let x = -500;
    let y = -500;
    let cx = x;
    let cy = y;
    let frame = 0;
    const tick = () => {
      cx += (x - cx) * 0.14;
      cy += (y - cy) * 0.14;
      // the page may be zoomed on desktop; the light lives inside it, so convert screen px to page px
      const z = parseFloat(document.documentElement.style.zoom || "1") || 1;
      el.style.transform = `translate3d(${cx / z}px, ${cy / z}px, 0)`;
      frame = Math.abs(x - cx) + Math.abs(y - cy) > 0.3 ? requestAnimationFrame(tick) : 0;
    };
    const onMove = (e: PointerEvent) => {
      x = e.clientX;
      y = e.clientY;
      el.classList.add("is-on");
      if (!frame) frame = requestAnimationFrame(tick);
    };
    const onLeave = () => el.classList.remove("is-on");
    window.addEventListener("pointermove", onMove, { passive: true });
    document.documentElement.addEventListener("pointerleave", onLeave);
    return () => {
      cancelAnimationFrame(frame);
      window.removeEventListener("pointermove", onMove);
      document.documentElement.removeEventListener("pointerleave", onLeave);
    };
  }, []);

  return <div ref={ref} className="cursor-light pointer-events-none fixed left-0 top-0" aria-hidden />;
}

/* Desktop (1024px and up): the whole site scales linearly with the width, so the composition, type,
   spacing and margins look the same on every screen, only larger or smaller.
   The content column is 77% of the screen (11.5% margins); the header sits outside it at 2.5%.
   Sections that must fit the screen height use --z to size themselves against the real screen. */
const DESIGN_WIDTH = 1546;
const MIN_DESKTOP = 1024;
const MAX_SCALE = 1.8;
/** type and elements follow only part of the width change, so wide screens do not blow headings up;
    the content column is a percentage, so the margins stay proportional anyway */
const SCALE_RATE = 0.6;

function applyFluidScale() {
  const w = window.innerWidth;
  const z = w >= MIN_DESKTOP ? Math.min(MAX_SCALE, 1 + (w / DESIGN_WIDTH - 1) * SCALE_RATE) : 1;
  const root = document.documentElement;
  root.style.zoom = z === 1 ? "" : z.toFixed(4);
  root.style.setProperty("--z", z.toFixed(4));
}

function useFluidScale() {
  useEffect(() => {
    applyFluidScale();
    window.addEventListener("resize", applyFluidScale);
    return () => window.removeEventListener("resize", applyFluidScale);
  }, []);
}

/** is the page behind this point light? Checks SVG fills and backgrounds; photos and video count as dark */
function isLightBehind(x: number, y: number, header: HTMLElement) {
  const hit = document.elementsFromPoint(x, y).find((e) => !header.contains(e));
  for (let e: Element | null = hit ?? null; e; e = e.parentElement) {
    if (e instanceof HTMLImageElement || e instanceof HTMLVideoElement) return false;
    const cs = getComputedStyle(e);
    const color = e instanceof SVGElement && cs.fill && cs.fill !== "none" ? cs.fill : cs.backgroundColor;
    const m = color.match(/rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?/);
    if (m && (m[4] === undefined || parseFloat(m[4]) > 0.5)) {
      const [r, g, b] = [m[1], m[2], m[3]].map((v) => parseFloat(v) / 255);
      return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.55;
    }
  }
  return false;
}

function Header() {

      if (!header || !mark) return;
      const r = mark.getBoundingClientRect();
      setOnLight(isLightBehind(r.right - Math.min(r.width, 40) / 2, r.top + r.height / 2, header));
    };
    const onScroll = () => {
      if (!frame) frame = window.requestAnimationFrame(update);
    };
    update();
    const t = window.setTimeout(update, 600); // after the page has painted
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.clearTimeout(t);
      window.cancelAnimationFrame(frame);
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
  }, []);

/** the office address; clicking it asks which navigation app to open */
function AddressLink() {
  const [open, setOpen] = useState(false);
  const ref = useRef<HTMLSpanElement>(null);

  useEffect(() => {
    if (!open) return;
    const onDown = (e: PointerEvent) => {
      if (!ref.current?.contains(e.target as Node)) setOpen(false);
    };
    const onKey = (e: KeyboardEvent) => {
      if (e.key === "Escape") setOpen(false);
    };
    document.addEventListener("pointerdown", onDown);
    window.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("pointerdown", onDown);
      window.removeEventListener("keydown", onKey);
    };
  }, [open]);

  const option = "address-option block rounded-[6px] px-3 py-2 text-navy";
  return (
    <span ref={ref} className="relative">
      <button
        type="button"
        onClick={() => setOpen((v) => !v)}
        aria-expanded={open}
        aria-controls="address-nav"
        className="link-sweep text-right"
      >
        {ADDRESS}
      </button>
      {open && (
        <span
          id="address-nav"
          className="panel-in absolute start-0 top-full z-20 mt-3 flex min-w-[200px] flex-col rounded-[10px] border border-gold/50 bg-cream p-2 text-[16px] leading-[1.3] shadow-[0_18px_40px_-18px_rgba(5,14,64,0.45)]"
        >
          <span className="px-3 pb-1 pt-1 text-[13px] text-navy/60">ניווט אל המשרד</span>
          <a href={MAPS_URL} target="_blank" rel="noopener noreferrer" onClick={() => setOpen(false)} className={option}>
            Google Maps <span className="sr-only">(נפתח בחלון חדש)</span>
          </a>
          <a href={WAZE_URL} target="_blank" rel="noopener noreferrer" onClick={() => setOpen(false)} className={option}>
            Waze <span className="sr-only">(נפתח בחלון חדש)</span>
          </a>
        </span>
      )}
    </span>
  );
}

/** Scroll-reveal: adds `is-visible` to [data-reveal], [data-reveal-group] and [data-anim] as they enter view */
function useRevealObserver() {
  useEffect(() => {
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            io.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.12, rootMargin: "0px 0px -6% 0px" },
    );
    document.querySelectorAll("[data-reveal], [data-reveal-group], [data-anim]").forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}

/** the article to show: /articles/:slug in the app, ?slug= in the local preview; falls back to the latest */
function currentArticle(): Article {
  const slug =
    new URLSearchParams(window.location.search).get("slug") ?? window.location.pathname.split("/").filter(Boolean).pop();
  return ARTICLES.find((a) => a.slug === slug) ?? ARTICLES[0];
}

function Hero() {
  const videoRef = useRef<HTMLVideoElement>(null);
  const mediaRef = useRef<HTMLDivElement>(null);

  useEffect(() => {
    const v = videoRef.current;
    if (!v) return;
    v.muted = true; // set on the element itself so autoplay is allowed
    v.playbackRate = 1.4; // encode is 2.6× slowed; this lands at ~1.9× slower than the original

    const start = () => v.play().catch(() => {});
    start();

    // some browsers block autoplay until the first interaction
    const retry = () => {
      start();
      window.removeEventListener("pointerdown", retry);
      window.removeEventListener("scroll", retry);
    };
    window.addEventListener("pointerdown", retry, { once: true });
    window.addEventListener("scroll", retry, { once: true });
    return () => {
      window.removeEventListener("pointerdown", retry);
      window.removeEventListener("scroll", retry);
    };
  }, []);

  // gentle parallax on the hero footage
  useEffect(() => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let frame = 0;
    const update = () => {
      frame = 0;
      const el = mediaRef.current;
      if (!el) return;
      const y = Math.min(window.scrollY, window.innerHeight);
      el.style.transform = "translate3d(0, " + y * 0.18 + "px, 0) scale(1.06)";
    };
    const onScroll = () => {
      if (!frame) frame = window.requestAnimationFrame(update);
    };
    update();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => {
      window.cancelAnimationFrame(frame);
      window.removeEventListener("scroll", onScroll);
    };
  }, []);


  return (
    <section id="top" className="relative isolate bg-navy-deep lg:bg-transparent">
      <div className="hero-sky absolute inset-x-0 top-0 -z-10 h-[52svh] overflow-hidden lg:inset-0 lg:h-auto">

        />

/** one card is dealt per ~45vh of scrolling */
const DEAL_SCROLL_VH = 45;

function Difference() {
  const trackRef = useRef<HTMLDivElement>(null);
  const [progress, setProgress] = useState(0);

  useEffect(() => {
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) {
      setProgress(1);
      return;
    }

    let frame = 0;
    const update = () => {
      frame = 0;
      const el = trackRef.current;
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const distance = rect.height - window.innerHeight;
      setProgress(distance > 0 ? clamp01(-rect.top / distance) : 1);
    };
    const onScroll = () => {
      if (!frame) frame = window.requestAnimationFrame(update);
    };

    update();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.cancelAnimationFrame(frame);
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
  }, []);

  return (
    <>
      {/* desktop / tablet: the deck is dealt card by card while scrolling */}
      <section
        ref={trackRef}
        className="relative hidden md:block"
        style={{ height: `calc((100dvh + ${DIFF_CARDS.length * DEAL_SCROLL_VH}vh) / var(--z, 1))` }}
        aria-label="מה באמת עושה את ההבדל?"
      >
        <div className="sticky top-0 flex h-[calc(100dvh/var(--z,1))] flex-col items-center justify-center overflow-hidden">
          <h2 className={cn(sectionTitle, "px-4 text-center")}>מה באמת עושה את ההבדל?</h2>

          <div className="relative mt-[clamp(28px,calc(6vh/var(--z,1)),100px)] aspect-[1175/480] w-[min(1175px,100%_-_4rem,calc((100dvh/var(--z,1)_-_200px)*2.45))]">
            {DIFF_CARDS.map((c, i) => {
              const dealt = easeOut(clamp01(progress * (DIFF_CARDS.length / 0.75) - i));
              return (
                <img
                  key={c.src}
                  src={c.src}
                  alt={c.alt}
                  className="absolute h-auto origin-[50%_46.907%] will-change-transform"
                  style={{
                    width: `${(DIFF_BOX.card / DIFF_BOX.w) * 100}%`,
                    left: `${(c.left / DIFF_BOX.w) * 100}%`,
                    top: `${(c.top / DIFF_BOX.h) * 100}%`,
                    opacity: dealt,
                    transform: `translate3d(0, ${(1 - dealt) * 16}%, 0) rotate(${c.rotate * (0.2 + 0.8 * dealt)}deg) scale(${0.92 + 0.08 * dealt})`,
                  }}
                />
              );
            })}
          </div>
        </div>
      </section>

      {/* mobile: vertical scroll drives the row of cards sideways */}
      <DifferenceMobile />
    </>
  );
}

function DifferenceMobile() {
  const sectionRef = useRef<HTMLElement>(null);
  const trackRef = useRef<HTMLDivElement>(null);
  const [travel, setTravel] = useState(0);

  useEffect(() => {
    const section = sectionRef.current;
    const track = trackRef.current;
    if (!section || !track) return;
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const measure = () => {
      // how far the row has to slide so the last card ends at the screen edge
      const viewport = track.parentElement?.clientWidth ?? window.innerWidth;
      setTravel(Math.max(0, track.scrollWidth - viewport));
    };

    let frame = 0;
    const update = () => {
      frame = 0;
      if (reduced) return;
      const rect = section.getBoundingClientRect();
      const distance = section.offsetHeight - window.innerHeight;
      const p = distance > 0 ? clamp01(-rect.top / distance) : 0;
      const viewport = track.parentElement?.clientWidth ?? window.innerWidth;
      const max = Math.max(0, track.scrollWidth - viewport);
      // RTL: the row starts on the right, so it slides to the right to reveal the rest
      track.style.transform = `translate3d(${p * max}px, 0, 0)`;
    };
    const onScroll = () => {
      if (!frame) frame = window.requestAnimationFrame(update);
    };

    measure();
    update();
    const ro = new ResizeObserver(() => {
      measure();
      update();
    });
    ro.observe(track);
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.cancelAnimationFrame(frame);
      ro.disconnect();
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
  }, []);

  return (
    <section
      ref={sectionRef}
      className="relative md:hidden"
      style={{ height: `calc(100svh + ${travel}px)` }}

function Articles() {
  const trackRef = useRef<HTMLDivElement>(null);
  const [edges, setEdges] = useState({ atStart: true, atEnd: false });

  const updateEdges = () => {
    const el = trackRef.current;
    if (!el) return;
    // RTL: scrollLeft is 0 at the start and grows negative towards the end
    const offset = Math.abs(el.scrollLeft);
    setEdges({ atStart: offset < 4, atEnd: offset + el.clientWidth >= el.scrollWidth - 4 });
  };

  useEffect(() => {
    const el = trackRef.current;
    if (!el) return;
    updateEdges();
    // re-measure once cards, images and fonts have laid out
    const ro = new ResizeObserver(updateEdges);
    ro.observe(el);
    Array.from(el.children).forEach((child) => ro.observe(child));
    window.addEventListener("load", updateEdges);
    return () => {
      ro.disconnect();
      window.removeEventListener("load", updateEdges);
    };
  }, []);

  const page = (dir: 1 | -1) => {
    const el = trackRef.current;
    if (!el) return;
    const cards = Array.from(el.children) as HTMLElement[];
    if (!cards.length) return;
    const step = cards[0].offsetWidth + 57;
    const current = Math.round(Math.abs(el.scrollLeft) / step);
    const target = Math.max(0, Math.min(cards.length - 1, current + dir));
    // RTL: scrolling towards the end means negative scrollLeft
    el.scrollTo({ left: -target * step, behavior: "smooth" });
  };

  return (
    <section id="articles" className="mt-[110px] md:mt-[170px]">
      <div className={cn(wrap, "flex flex-col gap-10 lg:flex-row lg:gap-[189px]")}>
        <div
          className="flex shrink-0 flex-row items-end justify-between gap-6 lg:h-[275px] lg:w-[204px] lg:flex-col lg:items-start"
          data-reveal="left"
        >
          <h2 className="font-semibold text-white text-[clamp(52px,6.038vw,80px)] leading-[1.0625]">
            טוב
            <br />
            לדעת
          </h2>
          <GoldButton href="#articles">למאמרים נוספים ←</GoldButton>
        </div>

        <div className="-mx-6 min-w-0 flex-1 md:-mx-8 lg:mx-0 lg:ml-[calc(-1*max(2rem,(100vw-1175px)/2))] lg:mt-[10px]">
          <div
            ref={trackRef}
            onScroll={updateEdges}
            className="no-scrollbar flex snap-x gap-[57px] overflow-x-auto px-6 pb-6 md:px-8 lg:px-0"
            data-reveal-group
          >
            {ARTICLES.map((a, i) => (
              <div key={i} style={{ "--reveal-delay": `${i * 110}ms` } as React.CSSProperties}>
                <ArticleCard {...a} />
              </div>
            ))}
          </div>

          <div className="mt-2 flex gap-3 px-6 md:px-8 lg:px-0">
            <CarouselArrow direction="prev" disabled={edges.atStart} onClick={() => page(-1)} />
            <CarouselArrow direction="next" disabled={edges.atEnd} onClick={() => page(1)} />
          </div>
        </div>
      </div>
    </section>
  );
}

function CountUp({ to, from = 0, suffix = "", duration = 1600 }: { to: number; from?: number; suffix?: string; duration?: number }) {
  const ref = useRef<HTMLSpanElement>(null);
  const [value, setValue] = useState(from);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      setValue(to);
      return;
    }
    let raf = 0;
    const io = new IntersectionObserver(
      ([entry]) => {
        if (!entry.isIntersecting) return;
        io.disconnect();
        const start = performance.now();
        const tick = (now: number) => {
          const t = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          setValue(Math.round(from + (to - from) * eased));
          if (t < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
      },
      { threshold: 0.6 },
    );
    io.observe(el);
    return () => {
      io.disconnect();
      cancelAnimationFrame(raf);
    };
  }, [to, from, duration]);

  return (
    <span ref={ref} dir="ltr" className="tabular-nums">
      {value.toLocaleString("en-US")}
      {suffix}
    </span>
  );
}

/** the chosen service, pulled out of its folder as a cream page with a gold frame */
function ServiceModal({
  dept,
  index,
  onNav,
  onClose,
}: {
  dept: (typeof DEPARTMENTS)[number];
  index: number;
  onNav: (i: number) => void;
  onClose: () => void;
}) {
  const label = dept.folders[index];
  const total = dept.folders.length;
  const detail = detailFor(label);
  const title = detail?.title ?? label.replace("\n", " ");
  const closeRef = useRef<HTMLButtonElement>(null);
  const navBtn = "service-nav grid size-10 place-items-center rounded-full border border-gold/60 text-gold disabled:opacity-30";

  useEffect(() => {
    closeRef.current?.focus();
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const onKey = (e: KeyboardEvent) => {
      if (e.key === "Escape") onClose();
    };
    window.addEventListener("keydown", onKey);
    return () => {
      document.body.style.overflow = prev;
      window.removeEventListener("keydown", onKey);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  return (
    <div role="dialog" aria-modal="true" aria-labelledby="service-modal-title" className="fixed inset-0 z-50 flex items-center justify-center p-4 md:p-8" dir="rtl">
      <div className="modal-backdrop absolute inset-0 bg-navy/75 backdrop-blur-[6px]" onClick={onClose} />
      <article className="modal-panel relative w-full max-w-[860px] rounded-[10px] bg-cream p-2 text-navy shadow-[0_30px_80px_rgba(0,0,0,0.45)] md:p-2.5">
        <div className="modal-scroll max-h-[calc(88dvh/var(--z,1)-20px)] overflow-y-auto rounded-[8px] border-2 border-gold px-6 pb-9 pt-5 md:px-12 md:pb-11 md:pt-6">
          {/* top bar */}
          <div className="flex items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <button type="button" className={navBtn} onClick={() => onNav(index - 1)} disabled={index === 0} aria-label="השירות הקודם">
                <span aria-hidden>→</span>
              </button>
              <span className="font-semibold text-gold text-[14px] tracking-[0.12em]" dir="ltr">
                {num(index)} / {String(total).padStart(2, "0")}
              </span>
              <button type="button" className={navBtn} onClick={() => onNav(index + 1)} disabled={index === total - 1} aria-label="השירות הבא">
                <span aria-hidden>←</span>
              </button>
            </div>
            <button ref={closeRef} type="button" onClick={onClose} aria-label="סגירה" className="modal-close grid size-10 place-items-center rounded-full border-2 border-gold text-gold">
              <svg viewBox="0 0 24 24" className="size-4" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" aria-hidden>
                <path d="M18 6 6 18M6 6l12 12" />
              </svg>
            </button>
          </div>

          <div key={index} className="panel-in">
            <p className="mt-6 font-semibold text-[#8C7443] text-[14px] md:text-[15px]">{dept.tab}</p>
            <h3 id="service-modal-title" className="mt-1 font-semibold text-gold text-[clamp(26px,2.6vw,36px)] leading-[1.15]">
              {noOrphan(title)}
            </h3>
            {detail && (
              <>
                <p className="mt-2 font-semibold text-[17px] leading-[1.5] md:text-[19px]">{noOrphan(detail.subtitle)}</p>
                <span className="mt-5 block h-px w-full bg-gold/70" aria-hidden />
                <div className="service-copy mt-6 grid gap-8 md:grid-cols-[1.25fr_1fr] md:gap-12">
                  <div className="space-y-4 font-light text-[17px] leading-[1.75]">
                    {detail.paragraphs.map((p) => (
                      <p key={p}>{noOrphan(p)}</p>
                    ))}
                  </div>
                  <div>
                    {detail.list && (
                      <>
                        {detail.listTitle && <p className="font-semibold text-[16px] md:text-[17px]">{detail.listTitle}</p>}
                        <ul className="mt-3 space-y-2.5 font-normal text-[16px] leading-[1.5] md:text-[17px]">
                          {detail.list.map((item) => (
                            <li key={item} className="flex items-center gap-3">
                              <span className="size-[6px] shrink-0 rotate-45 bg-gold" aria-hidden />
                              <span>{noOrphan(item)}</span>
                            </li>
                          ))}
                        </ul>
                      </>
                    )}
                    {detail.note && (
                      <p className="mt-6 font-normal text-[16px] leading-[1.65] text-[#8C7443] md:text-[17px]">{noOrphan(detail.note)}</p>
                    )}
                  </div>
                </div>
              </>
            )}
          </div>
        </div>
      </article>
    </div>
  );
}

function ReadingProgress() {
  const [p, setP] = useState(0);

  useEffect(() => {
    const body = document.getElementById("article-body");
    const onScroll = () => {
      if (!body) return;
      const r = body.getBoundingClientRect();
      const total = r.height - window.innerHeight * 0.6;
      setP(Math.min(1, Math.max(0, (window.innerHeight * 0.4 - r.top) / Math.max(1, total))));
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return (
    <div className="fixed inset-x-0 top-0 z-[60] h-[3px]" aria-hidden>
      <div className="h-full origin-right bg-gold" style={{ transform: `scaleX(${p})` }} />
    </div>
  );
}

type LegalBlock = string | string[];
type LegalSection = { h: string; blocks: LegalBlock[] };

const UPDATED = "ספטמבר 2026";

/** renders a paragraph, turning [[...]] into a visible placeholder */
function LegalText({ text }: { text: string }) {
  const parts = text.split(/(\[\[.*?\]\])/g);
  return (
    <>
      {parts.map((p, i) =>
        p.startsWith("[[") ? (
          <span key={i} className="legal-fill">
            {p.slice(2, -2)}
          </span>
        ) : (
          p
        ),
      )}
    </>
  );
}
